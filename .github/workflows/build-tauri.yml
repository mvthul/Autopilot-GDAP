name: Build CaptureTech Autopilot GDAP

on:
  push:
    tags:
      - "tauri-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Rust instellen
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Frontend afhankelijkheden installeren
        working-directory: tauri-app
        run: npm ci

      - name: Portable EXE bouwen
        working-directory: tauri-app
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: EXE als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-x64
          path: tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe
          if-no-files-found: error

      - name: GitHub Release publiceren
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe
